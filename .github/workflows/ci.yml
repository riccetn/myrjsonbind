name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        implementation: [myrjson, parsson]
    name: test (${{ matrix.implementation }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          server-id: github-myrjson
      - run: mvn --batch-mode --update-snapshots -P${{ matrix.implementation }} verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
